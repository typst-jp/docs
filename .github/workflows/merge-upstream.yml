name: Merge upstream changes

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream tag to merge"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-upstream:
    runs-on: ubuntu-24.04
    env:
      UPSTREAM_REF: ${{ github.event.inputs.upstream_ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          # Set up 'ours' merge driver
          git config --global merge.ours.driver true

      - name: Create new branch
        run: |
          git check-ref-format "refs/tags/$UPSTREAM_REF"
          git checkout -b "feature/merge-upstream-$UPSTREAM_REF"

      - name: Fetch upstream tag
        run: |
          git remote add upstream https://github.com/typst/typst.git
          git fetch --no-tags upstream \
            "refs/tags/$UPSTREAM_REF:refs/remotes/upstream-tags/$UPSTREAM_REF"

      - name: Attempt merge with commit markers
        run: |
          # Try to merge but allow conflicts
          TARGET_COMMIT=$(git rev-parse --verify \
            "refs/remotes/upstream-tags/$UPSTREAM_REF^{commit}")
          git merge --no-commit --no-ff "$TARGET_COMMIT" || {
            # Continue only when the merge started and stopped because of conflicts.
            test -f "$(git rev-parse --git-path MERGE_HEAD)" || exit 1
          }

          # Remove upstream `.github/` directory
          git checkout HEAD -- .github/
          git reset HEAD .github/

          # Resolve files deleted upstream in delete/modify conflicts
          git status --porcelain=v1 -z | while IFS= read -r -d '' entry; do
            case "$entry" in
              "UD "*) git rm -- "${entry#UD }" ;;
            esac
          done

          # Generated test references always follow upstream.
          while IFS= read -r -d '' file; do
            git checkout --theirs -- "$file"
            git add -- "$file"
          done < <(git diff --name-only --diff-filter=U -z -- tests/ref/)

          # Do not silently resolve non-text conflicts outside generated files.
          while IFS= read -r -d '' file; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=$file::Unresolved conflict is not a regular file"
              exit 1
            fi

            if ! grep -Iq . -- "$file"; then
              echo "::error file=$file::Unresolved binary conflict outside tests/ref/"
              exit 1
            fi

            if ! grep -q '^<<<<<<< ' -- "$file" \
              || ! grep -qx '=======' -- "$file" \
              || ! grep -q '^>>>>>>> ' -- "$file"; then
              echo "::error file=$file::Unresolved text conflict without conflict markers"
              exit 1
            fi
          done < <(git diff --name-only --diff-filter=U -z)

          # Commit the merge with conflict markers
          git commit -a -m "Merge upstream changes from $UPSTREAM_REF"

      - name: Push branch
        run: |
          git push --force origin "feature/merge-upstream-$UPSTREAM_REF"

      - name: Create Pull Request
        id: create-pr
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          PR_BODY: |
            > [!CAUTION]
            > コンフリクトの解消のため、このPull Requestは必ず**Create a merge commit**でマージしてください。

            このPull Requestでは、[上流リポジトリ](https://github.com/typst/typst)の[`${{ github.event.inputs.upstream_ref }}`](https://github.com/typst/typst/releases/tag/${{ github.event.inputs.upstream_ref }})の変更をマージします。

        with:
          script: |
            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `feature/merge-upstream-${process.env.UPSTREAM_REF}`,
              base: "main",
              title: `Merge upstream ${process.env.UPSTREAM_REF}`,
              body: process.env.PR_BODY
            });
            core.setOutput("pr_number", pr.data.number);

      - name: Check for conflict markers
        id: check-conflicts
        run: |
          CONFLICT_FILES=$(git grep -l "^<<<<<<<\|^=======\|^>>>>>>>" HEAD || echo "")
          if [ -n "$CONFLICT_FILES" ]; then
            echo "has_conflicts=true" >> $GITHUB_OUTPUT
            echo "conflict_files<<EOF" >> $GITHUB_OUTPUT
            echo "$CONFLICT_FILES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Comment on Pull Request if conflicts found
        if: steps.check-conflicts.outputs.has_conflicts == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const files = `${{ steps.check-conflicts.outputs.conflict_files }}`.split('\n').filter(f => f);
            const fileList = files.map(f => `- \`${f}\``).join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.create-pr.outputs.pr_number }},
              body: `> [!WARNING]\n> コンフリクトマーカーが検出されました。以下のファイルを確認し、コンフリクトを解消してください。\n\n${fileList}`
            });
